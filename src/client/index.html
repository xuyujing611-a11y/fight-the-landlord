<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 核心适配：禁用缩放，适配刘海屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI斗地主</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0D3B0F;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #game-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    /* 竖屏拦截器：仅在竖屏时显示，提示玩家旋转手机 */
    #orientation-lock {
      display: none;
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #1B5E20;
      z-index: 99999;
      color: white;
      justify-content: center; align-items: center;
      flex-direction: column;
      text-align: center;
    }
    .phone-icon { font-size: 48px; margin-bottom: 20px; animation: rotatePhone 1.5s ease-in-out infinite; }
    @keyframes rotatePhone { 0% { transform: rotate(0deg); } 100% { transform: rotate(-90deg); } }
    /* 核心修复：纯 CSS 拦截竖屏，不再操作 Canvas 旋转 */
    @media screen and (orientation: portrait) {
      #game-container { display: none !important; }
      #orientation-lock { display: flex !important; }
    }
    /* 加载画面 */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0D3B0F, #1B5E20, #2E7D32);
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-screen .title {
      font-size: 28px; color: #FFFFFF; font-weight: bold;
      margin-bottom: 24px; letter-spacing: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    #loading-screen .subtitle {
      font-size: 14px; color: #A5D6A7; margin-bottom: 40px;
    }
    .loader {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #4ECDC4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 竖屏拦截器 -->
  <div id="orientation-lock">
    <div class="phone-icon">📱</div>
    <h2 style="letter-spacing: 2px;">为了最佳体验<br><br>请将手机旋转至横屏游玩</h2>
  </div>

  <!-- 加载画面 -->
  <div id="loading-screen">
    <div class="title">🃏 AI斗地主</div>
    <div class="subtitle">和AI斗智斗勇</div>
    <div class="loader"></div>
  </div>

  <!-- 游戏容器 -->
  <div id="game-container"></div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/CardEngine.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/game.js"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var ls = document.getElementById('loading-screen');
        if (ls) ls.classList.add('hidden');
      }, 1200);
    });
  </script>
</body>
</html>
