<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 核心修复：viewport-fit=cover 适配刘海屏，禁止缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI斗地主</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0D3B0F;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    /* 核心修复：利用 CSS 强制横屏方案 */
    @media screen and (orientation: portrait) {
      #game-container {
        position: absolute;
        width: 100vh !important;
        height: 100vw !important;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
    }
    /* 保证 canvas 始终 100% 填充并由 Phaser 处理比例 */
    #game-container canvas {
      width: 100% !important; height: 100% !important;
      object-fit: contain;
    }
    /* 加载画面 */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0D3B0F, #1B5E20, #2E7D32);
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-screen .title {
      font-size: 28px; color: #FFFFFF; font-weight: bold;
      margin-bottom: 24px; letter-spacing: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    #loading-screen .subtitle {
      font-size: 14px; color: #A5D6A7; margin-bottom: 40px;
    }
    .loader {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #4ECDC4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 竖屏拦截器 -->
  <div id="orientation-lock">
    <div class="phone-icon">📱</div>
    <h2 style="letter-spacing: 2px;">为了最佳体验，请将手机横屏游玩</h2>
  </div>

  <!-- 加载画面 -->
  <div id="loading-screen">
    <div class="title">🃏 AI斗地主</div>
    <div class="subtitle">和AI斗智斗勇</div>
    <div class="loader"></div>
  </div>

  <!-- 游戏容器 -->
  <div id="game-container"></div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/CardEngine.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/game.js"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var ls = document.getElementById('loading-screen');
        if (ls) ls.classList.add('hidden');
      }, 1200);
    });
  </script>
</body>
</html>
