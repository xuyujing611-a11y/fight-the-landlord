<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>AI斗地主</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* 全局重置 + 竖屏锁定 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0D3B0F;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1B5E20, #2E7D32, #1B5E20);
      overflow: hidden;
    }
    #game-container canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    /* 加载画面 */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0D3B0F, #1B5E20, #2E7D32);
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-screen .title {
      font-size: 28px; color: #FFFFFF; font-weight: bold;
      margin-bottom: 24px; letter-spacing: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    #loading-screen .subtitle {
      font-size: 14px; color: #A5D6A7; margin-bottom: 40px;
    }
    .loader {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #4ECDC4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 加载画面 -->
  <div id="loading-screen">
    <div class="title">🃏 AI斗地主</div>
    <div class="subtitle">和AI斗智斗勇</div>
    <div class="loader"></div>
  </div>

  <!-- 游戏容器 -->
  <div id="game-container"></div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- CardEngine.js -->
  <script src="js/CardEngine.js"></script>

  <!-- API 客户端 -->
  <script src="js/apiClient.js"></script>

  <!-- 游戏主逻辑 -->
  <script src="js/game.js"></script>

  <script>
    // 监听游戏启动后隐藏加载画面
    window.addEventListener('load', function () {
      // Phaser 需要几帧初始化，延迟隐藏
      setTimeout(function () {
        var ls = document.getElementById('loading-screen');
        if (ls) ls.classList.add('hidden');
      }, 1200);
    });
  </script>
</body>
</html>
